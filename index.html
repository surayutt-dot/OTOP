    // --- Helper Utilities ---
    function formatBaht(num) {
      if (num === undefined || num === null || isNaN(num)) return '0.00';
      return Number(num).toLocaleString('th-TH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length < 3) return dateStr;
      const thaiMonths = [
        'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
        'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'
      ];
      const d = parseInt(parts[2], 10);
      const m = thaiMonths[parseInt(parts[1], 10) - 1];
      const y = parseInt(parts[0], 10) + 543;
      return `${d} ${m} ${y}`;
    }

    function formatThaiMonthYear(yearMonthStr) {
      if (!yearMonthStr) return '';
      const parts = yearMonthStr.split('-');
      const thaiMonths = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
        'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
      ];
      const m = thaiMonths[parseInt(parts[1], 10) - 1];
      const y = parseInt(parts[0], 10) + 543;
      return `${m} ${y}`;
    }

    // --- Accounting Calculations ---
    function getBalanceSheet() {
      let cash = 0;
      let fundLoan = 0;
      let shareCapital = 0;

      transactions.forEach(t => {
        const amt = Number(t.amount);
        if (t.accountDebit === 'cash') cash += amt;
        if (t.accountCredit === 'cash') cash -= amt;

        if (t.type === 'loan_initial' || t.accountCredit === 'loan_community_fund') fundLoan += amt;
        if (t.category === 'loan_repay' || (t.accountDebit === 'loan_community_fund' && t.type === 'expense')) fundLoan -= amt;

        if (t.type === 'equity_initial' || t.accountCredit === 'equity_shares') shareCapital += amt;
      });

      const pnl = getIncomeStatement(null);
      const retainedEarnings = pnl.netProfit;
      const totalAssets = cash;
      const totalLiabilities = fundLoan;
      const totalEquity = shareCapital + retainedEarnings;
      const totalLiabAndEquity = totalLiabilities + totalEquity;

      return {
        cash,
        fundLoan,
        shareCapital,
        retainedEarnings,
        totalAssets,
        totalLiabilities,
        totalEquity,
        totalLiabAndEquity,
        isBalanced: Math.abs(totalAssets - totalLiabAndEquity) < 0.01,
      };
    }

    function getDailySummary(date) {
      const dayTx = transactions.filter(t => t.date === date);
      const priorTx = transactions.filter(t => t.date < date);

      let opening = 0;
      priorTx.forEach(t => {
        if (t.accountDebit === 'cash') opening += Number(t.amount);
        if (t.accountCredit === 'cash') opening -= Number(t.amount);
      });

      let income = 0;
      let expense = 0;
      dayTx.forEach(t => {
        if (t.accountDebit === 'cash') income += Number(t.amount);
        if (t.accountCredit === 'cash') expense += Number(t.amount);
      });

      return {
        date,
        opening,
        income,
        expense,
        closing: opening + income - expense,
        transactions: dayTx,
      };
    }

    function getIncomeStatement(month) {

          revenue += amt;
        } else if (t.category === 'cogs_packaging') {
          cogsList['cogs_packaging'].amount += amt;
        } else if (t.category === 'cogs_raw_ext' || t.category === 'cogs_herb_member' || t.accountDebit === 'cogs_raw') {
          cogsList['cogs_raw'].amount += amt;
        } else if (t.category === 'cogs_labor' || t.accountDebit === 'cogs_labor') {
          cogsList['cogs_labor'].amount += amt;
        } else if (t.category === 'opex_shipping') {
          opexList['opex_shipping'].amount += amt;
        } else if (t.category === 'opex_penalty') {
          opexList['opex_penalty'].amount += amt;
        } else if (t.category === 'loan_repay' || t.accountDebit === 'loan_community_fund') {
          // debt principal reduction, not P&L
        } else if (t.type === 'expense') {
          // Check if custom category is COGS or OPEX
          const matchedCat = expenseCategories.find(c => c.id === t.category);
          if (matchedCat && matchedCat.type === 'cogs') {
            if (!cogsList[matchedCat.id]) {
              cogsList[matchedCat.id] = { name: matchedCat.name, amount: 0 };
            }
            cogsList[matchedCat.id].amount += amt;
          } else {
            const key = matchedCat ? matchedCat.id : 'opex_misc';
            const name = matchedCat ? matchedCat.name : (t.categoryName || 'ค่าใช้จ่ายทั่วไป');
            if (!opexList[key]) {
              opexList[key] = { name: name, amount: 0 };
            }
            opexList[key].amount += amt;
          }
        }
      });

      const totalCogs = Object.values(cogsList).reduce((sum, item) => sum + item.amount, 0);
      const grossProfit = revenue - totalCogs;
      const totalOpex = Object.values(opexList).reduce((sum, item) => sum + item.amount, 0);
      const netProfit = grossProfit - totalOpex;

      return {
        revenue,
        cogsList,
        totalCogs,
        grossProfit,
        grossMargin: revenue > 0 ? (grossProfit / revenue) * 100 : 0,
        opexList,
        totalOpex,
        netProfit,
        netMargin: revenue > 0 ? (netProfit / revenue) * 100 : 0,
      };
    }

    function onProductSelectChange(id, price) {

    function adjustQty(delta) {
      currentQty = Math.max(1, currentQty + delta);
      document.getElementById('modalQtyDisplay').textContent = currentQty;
      document.getElementById('incomeAmountInput').value = currentSelectedProdPrice * currentQty;
    }

    function quickSellProduct(prodId) {
      openIncomeModal();
      const p = products.find(x => x.id === prodId);
      if (p) {
        currentSelectedProdPrice = p.price;
        currentQty = 1;
        const radios = document.getElementsByName('prodSelect');
        radios.forEach(r => { if (r.value === prodId) r.checked = true; });
        document.getElementById('modalQtyDisplay').textContent = '1';
        document.getElementById('incomeAmountInput').value = p.price;
      }
    }

    function submitIncome(e) {
      e.preventDefault();
      const selectedRadio = document.querySelector('input[name="prodSelect"]:checked');
      if (!selectedRadio) return;
      const prod = products.find(p => p.id === selectedRadio.value);
      const amt = parseFloat(document.getElementById('incomeAmountInput').value);
      const date = document.getElementById('incomeDateInput').value;

      if (!amt || amt <= 0) return;

      const newTx = {
        id: `tx-${Date.now()}`,
        date: date,
        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
        type: 'income',
        category: 'sale_product',
        categoryName: `ขาย ${prod.name} (${currentQty} ${prod.unit})`,
        amount: amt,
        note: 'ขายสินค้าแปรรูปสมุนไพรชุมชน',
        accountDebit: 'cash',
        accountCredit: 'revenue_sales',
      };

      transactions.unshift(newTx);
      saveTransactions();
      closeModal();
      renderActiveTab();
      showToast('บันทึกรับเงินสำเร็จแล้ว!');
      try { confetti({ particleCount: 40, spread: 50 }); } catch {}
    }

                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                <span>+ เพิ่มรายจ่ายใหม่</span>
              </button>
            </div>

            <div class="space-y-1 max-h-48 overflow-y-auto pr-1">
              ${expenseCategories.map((cat, idx) => `
                <label class="p-2.5 rounded-xl border flex items-center justify-between cursor-pointer border-slate-200 bg-white hover:bg-slate-50 transition-all">
                  <div class="flex items-center gap-2 overflow-hidden">
                    <input type="radio" name="expenseCatSelect" value="${cat.id}" ${idx === 0 ? 'checked' : ''} onchange="onExpenseCatChange('${cat.id}')" class="accent-rose-600 shrink-0">
                    <span class="text-xs md:text-sm font-medium text-slate-800 truncate">${cat.name}</span>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${cat.desc}</span>
                    <button type="button" onclick="event.preventDefault(); event.stopPropagation(); deleteExpenseCat('${cat.id}')" class="px-2 py-0.5 text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md border border-rose-200 font-bold flex items-center gap-0.5" title="ลบประเภทนี้">
                      <i data-lucide="trash-2" class="w-3 h-3"></i>
                      <span>ลบ</span>
                    </button>
                  </div>
                </label>
              `).join('')}
            </div>
          </div>

          <div id="laborMemberBox" class="hidden bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-2 text-xs">
            <div class="flex items-center justify-between text-amber-950 font-bold">
              <span>จำนวนสมาชิกที่มาผลิต (คนละ 50 บาท):</span>
              <div class="flex items-center gap-2">
                <input type="number" id="laborCountInput" min="1" max="25" value="5" oninput="onLaborCountChange(this.value)" class="w-16 bg-white border border-amber-300 rounded-lg p-1 text-center font-bold">
                <span>คน</span>
              </div>
            </div>
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700">ยอดเงินที่จ่าย (บาท):</label>
            <input type="number" id="expenseAmountInput" step="0.01" required placeholder="0.00" class="w-full bg-rose-50/50 border-2 border-rose-400 rounded-xl px-4 py-2.5 text-lg font-bold text-rose-900">
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700">หมายเหตุเพิ่มเติม (ถ้ามี):</label>
            <input type="text" id="expenseNoteInput" placeholder="เช่น ซื้อขวด 200 ใบ จากบริษัทภายนอก" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs md:text-sm">
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700">วันที่ทำรายการ:</label>
            <input type="date" id="expenseDateInput" value="${today}" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs md:text-sm">
          </div>

          <button type="submit" class="w-full py-3 bg-gradient-to-r from-rose-600 to-red-600 text-white font-bold rounded-xl shadow-lg text-base">
            บันทึกรายจ่ายลงระบบ
          </button>
        </form>
      `;

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function onExpenseCatChange(catId) {
      const laborBox = document.getElementById('laborMemberBox');
      const amountInput = document.getElementById('expenseAmountInput');
      if (catId === 'cogs_labor') {
        laborBox.classList.remove('hidden');
        amountInput.value = 5 * 50;
      } else {
        laborBox.classList.add('hidden');
      }
    }

    function onLaborCountChange(val) {
      const count = parseInt(val, 10) || 1;
      document.getElementById('expenseAmountInput').value = count * 50;
    }

    function submitExpense(e) {
      e.preventDefault();
      const selectedRadio = document.querySelector('input[name="expenseCatSelect"]:checked');
      if (!selectedRadio) return;
      const cat = expenseCategories.find(c => c.id === selectedRadio.value);
      const amt = parseFloat(document.getElementById('expenseAmountInput').value);
      const note = document.getElementById('expenseNoteInput').value;
      const date = document.getElementById('expenseDateInput').value;

      if (!amt || amt <= 0) return;

      let accountDebit = 'opex_misc';
      if (cat.type === 'cogs') accountDebit = cat.id;
      if (cat.id === 'loan_repay') accountDebit = 'loan_community_fund';
      if (cat.type === 'opex') accountDebit = cat.id;

      const newTx = {
        id: `tx-${Date.now()}`,
        date: date,
        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
        type: 'expense',
        category: cat.id,
        categoryName: cat.name,
        amount: amt,
        note: note || (cat.id === 'cogs_labor' ? 'ค่าแรงสมาชิกในการผลิต' : ''),
        accountDebit: accountDebit,
        accountCredit: 'cash',
      };

      transactions.unshift(newTx);
      saveTransactions();
      closeModal();
      renderActiveTab();
      showToast('บันทึกรายจ่ายสำเร็จแล้ว!');
    }

    // --- MODAL: ADD CUSTOM PRODUCT ---
    function openAddProductModal() {
      const modal = document.getElementById('modalContainer');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base md:text-lg">เพิ่มสินค้าสมุนไพรใหม่</h3>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
        </div>

        <form onsubmit="submitNewProduct(event)" class="space-y-3.5 text-xs md:text-sm">
          <div class="space-y-1">
            <label class="font-semibold text-slate-700">ชื่อสินค้า:</label>
            <input type="text" id="newProdName" required placeholder="เช่น ยาหม่องไพลสด, สบู่เหลวน้ำผึ้ง" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="space-y-1">
              <label class="font-semibold text-slate-700">ราคาขาย (บาท):</label>
              <input type="number" id="newProdPrice" required step="1" min="1" placeholder="เช่น 60" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 font-bold">
            </div>
            <div class="space-y-1">
              <label class="font-semibold text-slate-700">หน่วยนับ:</label>
              <input type="text" id="newProdUnit" required value="ขวด" placeholder="ขวด, ก้อน, ตลับ, ชิ้น" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
            </div>
          </div>

          <div class="space-y-1">
            <label class="font-semibold text-slate-700">เลือกไอคอนสินค้า:</label>
            <div class="flex gap-2 text-2xl bg-slate-50 p-2 rounded-xl border border-slate-200 overflow-x-auto">
              ${['🧴', '🌿', '🥥', '🧼', '🦟', '🍯', '🍵', '📦', '✨', '🫙'].map((icon, i) => `
                <label class="cursor-pointer p-1.5 rounded-lg hover:bg-emerald-100 flex items-center justify-center">
                  <input type="radio" name="newProdIcon" value="${icon}" ${i === 0 ? 'checked' : ''} class="hidden">
                  <span>${icon}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg mt-2">
            บันทึกสินค้าใหม่ลงระบบ
          </button>
        </form>
      `;

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function submitNewProduct(e) {
      e.preventDefault();
      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const unit = document.getElementById('newProdUnit').value.trim() || 'ชิ้น';
      const iconRadio = document.querySelector('input[name="newProdIcon"]:checked');
      const icon = iconRadio ? iconRadio.value : '🌿';

      if (!name || isNaN(price) || price <= 0) return;

      const newProd = {
        id: `custom_p_${Date.now()}`,
        name,
        price,
        unit,
        icon,
        isCustom: true
      };

      products.push(newProd);
      saveProducts();
      closeModal();
      renderActiveTab();
      showToast(`เพิ่ม "${name}" เรียบร้อยแล้ว!`);
    }

    function deleteProduct(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      if (confirm(`ยืนยันลบสินค้า "${p.name}" ออกจากรายการใช่หรือไม่?`)) {
        products = products.filter(x => x.id !== id);
        saveProducts();
        const modal = document.getElementById('modalContainer');
        if (!modal.classList.contains('hidden')) {
          openIncomeModal();
        } else {
          renderActiveTab();
        }
        showToast(`ลบสินค้า "${p.name}" เรียบร้อยแล้ว`, '🗑️');
      }
    }

    // --- MODAL: ADD CUSTOM EXPENSE CATEGORY ---
    function openAddExpenseCatModal() {
      const modal = document.getElementById('modalContainer');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center">
              <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base md:text-lg">เพิ่มประเภทรายจ่ายใหม่</h3>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
        </div>

        <form onsubmit="submitNewExpenseCat(event)" class="space-y-3.5 text-xs md:text-sm">
          <div class="space-y-1">
            <label class="font-semibold text-slate-700">ชื่อรายการค่าใช้จ่าย:</label>
            <input type="text" id="newCatName" required placeholder="เช่น ค่าสติกเกอร์ฉลาก อย., ค่ากล่องพัสดุ" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5">
          </div>

          <div class="space-y-1">
            <label class="font-semibold text-slate-700">จัดหมวดหมู่ทางบัญชี:</label>
            <div class="space-y-2">
              <label class="p-2.5 rounded-xl border flex items-center gap-2 cursor-pointer border-slate-200 bg-white hover:bg-slate-50">
                <input type="radio" name="newCatType" value="cogs" checked class="accent-emerald-600">
                <div>
                  <span class="font-bold text-slate-800 block">ต้นทุนผลิต/วัตถุดิบ (COGS)</span>
                  <span class="text-[11px] text-slate-500">เช่น วัตถุดิบ, ขวด, ค่าแรงผลิต, ส่วนผสม</span>
                </div>
              </label>

              <label class="p-2.5 rounded-xl border flex items-center gap-2 cursor-pointer border-slate-200 bg-white hover:bg-slate-50">
                <input type="radio" name="newCatType" value="opex" class="accent-blue-600">
                <div>
                  <span class="font-bold text-slate-800 block">ค่าใช้จ่ายดำเนินงานทั่วไป (OPEX)</span>
                  <span class="text-[11px] text-slate-500">เช่น ค่าส่งของ, ค่าโฆษณา, ค่าปรับ, เบ็ดเตล็ด</span>
                </div>
              </label>
            </div>
          </div>

          <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-lg mt-2">
            บันทึกประเภทรายจ่ายลงระบบ
          </button>
        </form>
      `;

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function submitNewExpenseCat(e) {
      e.preventDefault();
      const name = document.getElementById('newCatName').value.trim();
      const type = document.querySelector('input[name="newCatType"]:checked').value;

      if (!name) return;

      const newCat = {
        id: `custom_exp_${Date.now()}`,
        name,
        type,
        desc: type === 'cogs' ? 'ต้นทุนผลิต' : 'ค่าใช้จ่ายดำเนินงาน',
        isCustom: true
      };

      expenseCategories.push(newCat);
      saveExpenseCategories();
      closeModal();
      renderActiveTab();
      showToast(`เพิ่ม "${name}" เรียบร้อยแล้ว!`);
    }

    function deleteExpenseCat(id) {
      const cat = expenseCategories.find(x => x.id === id);
      if (!cat) return;
      if (confirm(`ยืนยันลบประเภทรายจ่าย "${cat.name}" ออกจากรายการใช่หรือไม่?`)) {
        expenseCategories = expenseCategories.filter(x => x.id !== id);
        saveExpenseCategories();
        const modal = document.getElementById('modalContainer');
        if (!modal.classList.contains('hidden')) {
          openExpenseModal();
        } else {
          renderActiveTab();
        }
        showToast(`ลบประเภทรายจ่าย "${cat.name}" เรียบร้อยแล้ว`, '🗑️');
      }
    }

    function restoreDefaultCatalog() {
      if (confirm('คุณต้องการกู้คืนรายการสินค้า (5 รายการ) และประเภทรายจ่าย (8 รายการ) กลับเป็นค่าเริ่มต้นใช่หรือไม่?')) {
        products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        expenseCategories = JSON.parse(JSON.stringify(DEFAULT_EXPENSE_CATEGORIES));
        saveProducts();
        saveExpenseCategories();
        renderActiveTab();
        showToast('กู้คืนสินค้าและรายจ่ายตั้งต้นแล้ว!', '🔄');
      }
    }

    function closeModal() {
      document.getElementById('modalContainer').classList.add('hidden');
    }

    function deleteTransaction(id) {
      if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
        transactions = transactions.filter(t => t.id !== id);
        saveTransactions();
        renderActiveTab();
        showToast('ลบรายการเรียบร้อยแล้ว', '🗑️');
      }
    }

    function resetData() {
      if (confirm('ยืนยันรีเซ็ตข้อมูลกลับเป็นตัวอย่างจากงานวิจัยบ้านทรายใช่หรือไม่?')) {
        transactions = JSON.parse(JSON.stringify(INITIAL_TRANSACTIONS));
        products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        expenseCategories = JSON.parse(JSON.stringify(DEFAULT_EXPENSE_CATEGORIES));
        saveTransactions();
        saveProducts();
        saveExpenseCategories();
        renderActiveTab();
        showToast('รีเซ็ตข้อมูลเรียบร้อยแล้ว', '🔄');
      }
    }

    function changeSelectedDate(val) {
      selectedDate = val;
      renderActiveTab();
    }

    function changeSelectedMonth(val) {
      selectedMonth = val;
      renderActiveTab();
    }

    function setReportSubTab(sub) {
      reportSubTab = sub;
      renderActiveTab();
    }

    function searchTransactions(val) {
      searchQuery = val;
      renderHistoryTab(document.getElementById('appContainer'));
      lucide.createIcons();
    }

    function shareDailyLine() {
      const daily = getDailySummary(selectedDate);
      const text = `📢 รายงานการเงินประจำวัน
🌿 วิสาหกิจชุมชนแปรรูปสมุนไพรบ้านทราย
📅 วันที่: ${formatThaiDate(daily.date)}
--------------------------------
💵 เงินสดยกมาต้นวัน: ${formatBaht(daily.opening)} บาท
🟢 ยอดรับวันนี้: +${formatBaht(daily.income)} บาท
🔴 ยอดจ่ายวันนี้: -${formatBaht(daily.expense)} บาท
--------------------------------
💰 เงินสดคงเหลือสิ้นวัน: ${formatBaht(daily.closing)} บาท
✅ บันทึกถูกต้องพร้อมตรวจสอบ`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        showToast('คัดลอกสรุปสิ้นวัน พร้อมส่ง LINE แล้ว!', '📋');
      } else {
        alert(text);
      }
    }

    function shareMonthlyLine() {
      const pnl = getIncomeStatement(selectedMonth);
      const bs = getBalanceSheet();
      const text = `📊 สรุปงบการเงินประจำเดือน ${formatThaiMonthYear(selectedMonth)}
🌿 วิสาหกิจชุมชนแปรรูปสมุนไพรบ้านทราย
--------------------------------
📈 [งบกำไรขาดทุน]
- รายได้จากการขาย: ${formatBaht(pnl.revenue)} บาท
- หัก ต้นทุนผลิต: ${formatBaht(pnl.totalCogs)} บาท
= กำไรขั้นต้น: ${formatBaht(pnl.grossProfit)} บาท
- หัก ค่าใช้จ่ายดำเนินงาน: ${formatBaht(pnl.totalOpex)} บาท
⭐ กำไรสุทธิ: ${formatBaht(pnl.netProfit)} บาท (${pnl.netMargin.toFixed(1)}%)
--------------------------------
⚖️ [งบดุล & สภาพคล่อง]
- เงินสดคงเหลือ: ${formatBaht(bs.cash)} บาท
- หนี้สินกองทุนคงเหลือ: ${formatBaht(bs.fundLoan)} บาท
- ทุนหุ้นสมาชิก (25 คน): ${formatBaht(bs.shareCapital)} บาท
- กำไรสะสม: ${formatBaht(bs.retainedEarnings)} บาท
✅ งบดุลสมดุล 100%`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        showToast('คัดลอกงบการเงิน พร้อมส่ง LINE แล้ว!', '📋');
      } else {
        alert(text);
      }
    }

    // --- Init ---
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderCash();
      renderActiveTab();
    });
  </script>
</body>
